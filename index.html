<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fish Live Admin</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="panel">

<h1>🎮 Fish Live Admin</h1>

<label>Usuário do TikTok</label>

<input
id="username"
type="text"
value="cristallivegame"
placeholder="@usuario">

<div class="buttons">

<button id="connect">
Conectar
</button>

<button id="reconnect">
Reconectar
</button>

</div>

<hr>

<h2>Status</h2>

<p>Servidor:
<span id="server">🟢 Online</span>
</p>

<p>TikTok:
<span id="tiktok">🔴 Offline</span>
</p>

<hr>

<h2>Eventos</h2>

<div class="buttons">

<button id="like">❤️ Like</button>

<button id="comment">💬 Comentário</button>

<button id="follow">👤 Follow</button>

<button id="gift">🎁 Gift</button>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
